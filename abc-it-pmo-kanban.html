<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC IT PMO Kanban Board</title>
<style>
  /* ============================= Design tokens ============================= */
  :root {
    --color-bg: #f2f5fa;
    --color-surface: #ffffff;
    --color-border: #d7e0ec;
    --color-header-bg: #0b2f6b;
    --color-header-text: #ffffff;
    --color-primary: #0b2f6b;
    --color-primary-dark: #082352;
    --color-primary-light: #e8eefc;
    --color-accent: #1d5fd6;
    --color-text: #1a2333;
    --color-text-muted: #5b6a82;
    --color-critical: #c0223a;
    --color-high: #c97a10;
    --color-medium: #1d5fd6;
    --color-low: #6b7686;
    --color-danger: #c0223a;
    --color-success: #1a8a4a;
    --color-warning: #c97a10;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --focus-ring: 3px solid #1d5fd6aa;
    --color-card: #ffffff;
    --color-field: #ffffff;
    --color-btn: #1d5fd6;
    --color-btn-hover: #164ba8;
    --color-header-btn-text: #0b2f6b;
    --color-danger-soft: #fbe2e6;
    --color-danger-border: #f3b7c1;
    --color-danger-wash: #fff6f7;
    --pill-critical-bg: #fbe2e6; --pill-critical-bd: #f3b7c1;
    --pill-high-bg: #fbead0; --pill-high-bd: #f0cd8f;
    --pill-medium-bg: #e0eaff; --pill-medium-bd: #b7cdf5;
    --pill-low-bg: #eceff3; --pill-low-bd: #d3d9e1;
    --modal-bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --color-bg: #0d1524; --color-surface: #152036; --color-border: #2a3b57;
      --color-primary: #a9c2f5; --color-primary-light: #1f3050; --color-accent: #6a9ef7;
      --color-text: #e5ebf5; --color-text-muted: #9fb0c8;
      --color-critical: #ff8294; --color-high: #f2ab4d; --color-medium: #7fadf8; --color-low: #aab4c2;
      --color-danger: #ff8294; --color-success: #1f8f50; --color-warning: #b86d0c;
      --color-card: #1a2640; --color-field: #101a2e; --modal-bg: #152036;
      --color-danger-soft: #3a1a24; --color-danger-border: #6a2a3a; --color-danger-wash: #2a1a22;
      --pill-critical-bg: #3a1a24; --pill-critical-bd: #6a2a3a;
      --pill-high-bg: #3a2a12; --pill-high-bd: #6a4a1c;
      --pill-medium-bg: #1a2c52; --pill-medium-bd: #2f4a82;
      --pill-low-bg: #242f40; --pill-low-bd: #3a475c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #0d1524; --color-surface: #152036; --color-border: #2a3b57;
    --color-primary: #a9c2f5; --color-primary-light: #1f3050; --color-accent: #6a9ef7;
    --color-text: #e5ebf5; --color-text-muted: #9fb0c8;
    --color-critical: #ff8294; --color-high: #f2ab4d; --color-medium: #7fadf8; --color-low: #aab4c2;
    --color-danger: #ff8294; --color-success: #1f8f50; --color-warning: #b86d0c;
    --color-card: #1a2640; --color-field: #101a2e; --modal-bg: #152036;
    --color-danger-soft: #3a1a24; --color-danger-border: #6a2a3a; --color-danger-wash: #2a1a22;
    --pill-critical-bg: #3a1a24; --pill-critical-bd: #6a2a3a;
    --pill-high-bg: #3a2a12; --pill-high-bd: #6a4a1c;
    --pill-medium-bg: #1a2c52; --pill-medium-bd: #2f4a82;
    --pill-low-bg: #242f40; --pill-low-bd: #3a475c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-stack);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.4;
  }

  a, button, input, select, textarea {
    font-family: inherit;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }

  /* ============================= Header ============================= */
  header.app-header {
    background: var(--color-header-bg);
    color: var(--color-header-text);
    padding: var(--space-md) var(--space-lg);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--space-md);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .wordmark .wordmark-badge {
    background: #ffffff;
    color: #0b2f6b;
    border-radius: var(--radius-sm);
    padding: 2px 8px;
    font-size: 0.85rem;
    font-weight: 800;
  }

  .btn {
    border: none;
    border-radius: var(--radius-md);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: #ffffff;
    color: var(--color-header-btn-text);
  }
  .btn-primary:hover { background: #e6ecfa; }

  .btn-secondary {
    background: var(--color-btn);
    color: #fff;
  }
  .btn-secondary:hover { background: var(--color-btn-hover); }

  .btn-ghost {
    background: transparent;
    color: var(--color-text);
    border: 1px solid var(--color-border);
  }
  .btn-ghost:hover { background: var(--color-primary-light); }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Summary strip */
  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    margin-top: var(--space-md);
  }

  .summary-chip {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    font-size: 0.8rem;
    display: flex;
    gap: 6px;
    align-items: baseline;
  }

  .summary-chip strong { font-size: 1rem; }

  .summary-chip.overdue-chip {
    background: rgba(192,34,58,0.25);
    border-color: rgba(255,180,180,0.5);
  }

  .demo-note {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.8);
    margin-top: var(--space-sm);
  }

  /* ============================= Main layout ============================= */
  main {
    padding: var(--space-lg);
    max-width: 1600px;
    margin: 0 auto;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-md);
    align-items: flex-end;
    margin-bottom: var(--space-lg);
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
  }

  .filter-field label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input, select, textarea {
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    color: var(--color-text);
    background: var(--color-field);
  }

  .filter-clear {
    align-self: flex-end;
  }

  /* ============================= Board ============================= */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
  }

  @media (max-width: 768px) {
    .board { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    min-height: 200px;
    transition: background-color 0.15s ease, box-shadow 0.15s ease;
  }

  .column.drag-over {
    background: var(--color-primary-light);
    box-shadow: inset 0 0 0 2px var(--color-accent);
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border);
  }

  .column-header h2 {
    margin: 0;
    font-size: 1rem;
  }

  .count-badge {
    background: var(--color-primary-light);
    color: var(--color-primary);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .card-list {
    padding: var(--space-sm);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    flex: 1;
    min-height: 80px;
  }

  .empty-hint {
    color: var(--color-text-muted);
    font-size: 0.8rem;
    text-align: center;
    padding: var(--space-md);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-md);
  }

  /* ============================= Cards ============================= */
  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-left-width: 5px;
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    cursor: grab;
    position: relative;
  }

  .card:active { cursor: grabbing; }

  .card.priority-critical { border-left-color: var(--color-critical); }
  .card.priority-high { border-left-color: var(--color-high); }
  .card.priority-medium { border-left-color: var(--color-medium); }
  .card.priority-low { border-left-color: var(--color-low); }

  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-sm);
  }

  .card-id {
    font-size: 0.7rem;
    color: var(--color-text-muted);
    font-weight: 600;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 4px 0 6px;
    word-break: break-word;
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--color-text-muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
  }

  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1px solid transparent;
  }

  .pill-critical { background: var(--pill-critical-bg); color: var(--color-critical); border-color: var(--pill-critical-bd); }
  .pill-high { background: var(--pill-high-bg); color: var(--color-high); border-color: var(--pill-high-bd); }
  .pill-medium { background: var(--pill-medium-bg); color: var(--color-medium); border-color: var(--pill-medium-bd); }
  .pill-low { background: var(--pill-low-bg); color: var(--color-low); border-color: var(--pill-low-bd); }

  .tag {
    background: var(--color-primary-light);
    color: var(--color-primary);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    font-weight: 600;
  }

  .badge-overdue {
    background: var(--color-danger-soft);
    color: var(--color-critical);
    border: 1px solid var(--color-danger-border);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    font-weight: 700;
  }

  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    margin-top: 6px;
    border-top: 1px solid var(--color-border);
    padding-top: 6px;
  }

  .move-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-text-muted);
    white-space: nowrap;
  }

  .move-select {
    font-size: 0.75rem;
    padding: 4px 6px;
    flex: 1;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--color-danger);
    font-size: 0.9rem;
    line-height: 1;
  }
  .icon-btn:hover { background: var(--color-danger-soft); }

  .delete-confirm {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    margin-top: 6px;
    background: var(--color-danger-wash);
    border: 1px solid var(--color-danger-border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
  }

  .delete-confirm button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
  }

  .confirm-yes { background: var(--color-danger); color: #fff; }
  .confirm-no { background: var(--color-border); color: var(--color-text); }

  /* ============================= Modal ============================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 20, 40, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-xl) var(--space-md);
    overflow-y: auto;
    z-index: 100;
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--modal-bg);
    border-radius: var(--radius-lg);
    max-width: 560px;
    width: 100%;
    padding: var(--space-lg);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-md);
  }

  .modal-header h2 { margin: 0; font-size: 1.1rem; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }

  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field.full-width { grid-column: 1 / -1; }

  .form-field label {
    font-size: 0.8rem;
    font-weight: 600;
  }

  .required-mark { color: var(--color-danger); }

  .field-error {
    color: var(--color-danger);
    font-size: 0.75rem;
    min-height: 1em;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-sm);
    margin-top: var(--space-lg);
  }

  .char-count {
    font-size: 0.7rem;
    color: var(--color-text-muted);
    text-align: right;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ============================= Critical impact view ============================= */
  .critical-view {
    background: var(--color-danger-wash);
    border: 1px solid var(--color-danger-border);
    border-left: 6px solid var(--color-critical);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .critical-head { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-sm); }
  .critical-head h2 { margin: 0; font-size: 1rem; color: var(--color-critical); }
  .critical-icon { width: 22px; height: 22px; flex: none; }
  .critical-sub { margin: 0 0 var(--space-md); font-size: 0.8rem; color: var(--color-text-muted); }
  .critical-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-md); }
  .critical-item {
    background: var(--color-card);
    border: 1px solid var(--color-danger-border);
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .critical-item-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.7rem; font-weight: 700; }
  .critical-flag { display: inline-flex; align-items: center; gap: 4px; color: var(--color-critical); background: var(--color-danger-soft); border: 1px solid var(--color-danger-border); border-radius: var(--radius-sm); padding: 2px 6px; }
  .critical-flag svg { width: 12px; height: 12px; }
  .critical-score { margin-left: auto; color: var(--color-text-muted); }
  .critical-item h3 { margin: 0; font-size: 0.9rem; word-break: break-word; }
  .critical-meta { font-size: 0.78rem; color: var(--color-text-muted); }
  .critical-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .reason { background: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-sm); padding: 2px 6px; font-size: 0.7rem; font-weight: 600; }
  .critical-action { font-size: 0.8rem; border-top: 1px solid var(--color-border); padding-top: 6px; }
  .critical-empty { margin: 0; font-size: 0.85rem; color: var(--color-text-muted); }

  /* ============================= Overview (pie + summary) ============================= */
  .overview {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    margin-bottom: var(--space-lg);
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: var(--space-lg);
  }
  .overview h2 { margin: 0 0 var(--space-sm); font-size: 1rem; }
  .pie-wrap { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; min-width: 0; }
  .pie {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    flex: none;
    border: 1px solid var(--color-border);
  }
  .pie-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
  .pie-legend li { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .swatch-backlog { background: var(--color-low); }
  .swatch-progress { background: var(--color-accent); }
  .swatch-blocked { background: var(--color-critical); }
  .swatch-done { background: var(--color-success); }
  .pie-note { margin: var(--space-sm) 0 0; font-size: 0.8rem; color: var(--color-text-muted); }
  .exec-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--space-sm); font-size: 1rem; }

  @media (max-width: 768px) {
    .overview { grid-template-columns: 1fr; }
  }

  /* ============================= Toasts ============================= */
  #toast-region {
    position: fixed;
    bottom: var(--space-lg);
    right: var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    z-index: 200;
    max-width: 320px;
  }

  .toast {
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 0.85rem;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  .toast-success { background: var(--color-success); }
  .toast-warning { background: var(--color-warning); }
  .toast-error { background: var(--color-danger); }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<!-- ============================= Header: wordmark, summary strip, add-task ============================= -->
<header class="app-header">
  <div class="header-top">
    <div class="wordmark">
      <span class="wordmark-badge">PMO</span>
      <span>ABC IT PMO — Kanban Board</span>
    </div>
    <button type="button" class="btn btn-primary" id="open-add-task-btn">+ Add Task</button>
  </div>

  <div class="summary-strip" id="summary-strip" aria-live="polite"></div>

  <p class="demo-note">
    Demo mode: this board keeps state in memory only for this browser tab. Refreshing the page resets it to the seeded demo data — no data is saved to a server or your device.
  </p>
</header>

<main>
  <!-- ============================= Filter bar ============================= -->
  <section class="filter-bar" aria-label="Filter tasks">
    <div class="filter-field">
      <label for="filter-project">Project / Workstream</label>
      <select id="filter-project">
        <option value="">All projects</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="text" id="filter-assignee" placeholder="e.g. Priya">
    </div>
    <div class="filter-field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority">
        <option value="">All priorities</option>
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <button type="button" class="btn btn-ghost filter-clear" id="clear-filters-btn">Clear filters</button>
  </section>

  <!-- ============================= Overview: pie chart + executive summary ============================= -->
  <section class="overview" id="overview" aria-label="Overview of all activities"></section>

  <!-- ============================= Critical impact view for management ============================= -->

/* =========================================================================

   is clicked. Until then, submissions may silently not arrive, which is

/* =========================================================================
   STATE — single source of truth. Everything renders from this object.
   No localStorage / sessionStorage / cookies / IndexedDB are used anywhere:
   a page refresh intentionally resets to the seeded demo data below.
   ========================================================================= */
const state = {

const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PROJECTS = [

/* =========================================================================
   UTILITIES
   ========================================================================= */

// Escape any user-supplied string before inserting into innerHTML.
function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function todayIsoDate() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString().slice(0, 10);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayIsoDate();
}

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function nextTaskId() {
  state.taskIdCounter += 1;
  return "ABC-ITPM-" + String(state.taskIdCounter).padStart(4, "0");
}

function priorityClass(priority) {

}

/* =========================================================================

function getFilteredTasks() {
  const { project, assignee, priority } = state.filters;
  return state.tasks.filter((t) => {
    if (project && t.project !== project) return false;

function renderSummaryStrip() {

function renderColumn(status) {
  const tasks = getFilteredTasks().filter((t) => t.status === status);

    ? tasks.map(renderCard).join("")
    : `<p class="empty-hint">No tasks</p>`;

  return `
    <div class="column" data-status="${escapeHtml(status)}">
      <div class="column-header">
        <h2>${escapeHtml(status)}</h2>
        <span class="count-badge">${tasks.length}</span>
      </div>
      <div class="card-list" data-status="${escapeHtml(status)}">
        ${cardsHtml}
      </div>
    </div>
  `;
}

/* =========================================================================
   IMPACT — business-impact score used by the critical view and the summary.
   Score = priority (Critical 40, High 25, Medium 10, Low 0)
         + 25 if overdue, + 1 per day overdue (max 15)
         + 15 if Blocked
         + 10 for Compliance or Cybersecurity work (regulatory / security exposure).
   Done tasks score 0. A task is flagged CRITICAL when it is not Done and is
   Critical priority or scores 60 or more.
   ========================================================================= */
const PRIORITY_WEIGHT = { "Critical": 40, "High": 25, "Medium": 10, "Low": 0 };
const CRITICAL_SCORE_THRESHOLD = 60;

function daysOverdue(task) {
  const due = new Date(task.dueDate + "T00:00:00");
  const today = new Date(todayIsoDate() + "T00:00:00");
  return Math.max(0, Math.round((today - due) / 86400000));
}

function impactReasons(task) {
  const reasons = [`${task.priority} priority`];
  if (isOverdue(task)) reasons.push(`Overdue ${daysOverdue(task)} day${daysOverdue(task) === 1 ? "" : "s"}`);
  if (task.status === "Blocked") reasons.push("Blocked");
  if (task.category === "Compliance" || task.category === "Cybersecurity") reasons.push(`${task.category} exposure`);
  return reasons;
}

function impactScore(task) {
  if (task.status === "Done") return 0;
  let score = PRIORITY_WEIGHT[task.priority] || 0;
  if (isOverdue(task)) score += 25 + Math.min(15, daysOverdue(task));
  if (task.status === "Blocked") score += 15;
  if (task.category === "Compliance" || task.category === "Cybersecurity") score += 10;
  return score;
}

function isCriticalImpact(task) {
  return task.status !== "Done" && (task.priority === "Critical" || impactScore(task) >= CRITICAL_SCORE_THRESHOLD);
}

function byImpact(a, b) {
  return impactScore(b) - impactScore(a) || a.dueDate.localeCompare(b.dueDate);
}

// Suggested redirection for a flagged task, based on its status and the lowest-impact open work.
function redirectAction(task, openTasks) {
  const donor = openTasks
    .filter((t) => t.id !== task.id && t.status !== "Blocked" && !isCriticalImpact(t))
    .sort((a, b) => impactScore(a) - impactScore(b))[0];
  if (task.status === "Blocked") {
    return `Escalate the dependency for ${task.assignee} to a sponsor and agree an unblock date.`;
  }
  if (task.status === "Backlog") {
    return donor
      ? `Redirect capacity: start now and pause ${donor.id} ${donor.title} (lowest impact).`
      : "Start now: nothing lower-impact is available to pause, so add capacity.";
  }
  return `Protect ${task.assignee}'s time and agree a recovery date; add support if it slips again.`;
}

function renderCriticalView() {
  const open = state.tasks.filter((t) => t.status !== "Done");
  const flagged = open.filter(isCriticalImpact).sort(byImpact);
  const icon = '<svg class="critical-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22L12 2z" fill="var(--color-critical)"/><rect x="11" y="9" width="2" height="6" fill="#fff"/><rect x="11" y="16.5" width="2" height="2" fill="#fff"/></svg>';
  const smallIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22L12 2z" fill="currentColor"/><rect x="11" y="9" width="2" height="6" fill="#fff"/><rect x="11" y="16.5" width="2" height="2" fill="#fff"/></svg>';

  const items = flagged.map((t, i) => `
    <li class="critical-item">
      <div class="critical-item-top">
        <span class="critical-flag">${smallIcon}CRITICAL #${i + 1}</span>
        <span>${escapeHtml(t.id)}</span>
        <span class="critical-score">Impact ${impactScore(t)}</span>
      </div>
      <h3>${escapeHtml(t.title)}</h3>
      <div class="critical-meta">${escapeHtml(t.project)} · ${escapeHtml(t.assignee)} · due ${escapeHtml(formatDate(t.dueDate))} · ${escapeHtml(t.status)}</div>
      <div class="critical-reasons">${impactReasons(t).map((r) => `<span class="reason">${escapeHtml(r)}</span>`).join("")}</div>
      <div class="critical-action"><strong>Redirect:</strong> ${escapeHtml(redirectAction(t, open))}</div>
    </li>`).join("");

  document.getElementById("critical-view").innerHTML = `
    <div class="critical-head">${icon}<h2>Critical: needs management attention (${flagged.length})</h2></div>
    <p class="critical-sub">Ranked by impact to the company: priority, days overdue, blocked work and compliance or security exposure. Done work is excluded.</p>
    ${flagged.length ? `<ol class="critical-list">${items}</ol>` : '<p class="critical-empty">No critical items. Nothing needs redirection right now.</p>'}`;
}

/* =========================================================================
   OVERVIEW — pie chart of all tasks by status plus a 3-bullet executive summary.
   Always computed over state.tasks (not the filtered view).
   ========================================================================= */
const PIE_COLORS = {
  "Backlog": "var(--color-low)",
  "In Progress": "var(--color-accent)",
  "Blocked": "var(--color-critical)",
  "Done": "var(--color-success)",
};
const PIE_SWATCH = {
  "Backlog": "swatch-backlog",
  "In Progress": "swatch-progress",
  "Blocked": "swatch-blocked",
  "Done": "swatch-done",
};

function priorityRank(task) {
  return PRIORITIES.indexOf(task.priority);
}

function describeTask(task) {
  return `${task.id} ${task.title} (${task.assignee}, due ${formatDate(task.dueDate)})`;
}

function buildExecutiveSummary() {
  const total = state.tasks.length;
  const pct = (n) => `${Math.round((n / total) * 1000) / 10}%`;
  const open = state.tasks.filter((t) => t.status !== "Done");
  const blocked = state.tasks.filter((t) => t.status === "Blocked").sort(byImpact);
  const overdue = open.filter(isOverdue).sort(byImpact);
  const backlog = state.tasks.filter((t) => t.status === "Backlog").sort(byImpact);
  const named = new Set();
  const bullets = [];

  if (blocked.length) {
    const top = blocked.slice(0, 2);
    top.forEach((t) => named.add(t.id));
    bullets.push({
      lead: `${pct(blocked.length)} blocked (${blocked.length}):`,
      text: `escalate ${top.map((t) => `${t.id} (${t.assignee})`).join(" and ")} this week.`,
    });
  } else {
    bullets.push({ lead: "0% blocked:", text: "check vendor and approval dependencies before work starts." });
  }

  const overdueRest = overdue.filter((t) => !named.has(t.id));
  if (overdueRest.length) {
    const top = overdueRest[0];
    named.add(top.id);
    bullets.push({
      lead: `${overdue.length} of ${total} overdue:`,
      text: `re-plan ${top.id} first (${top.priority}, ${top.assignee}).`,
    });
  } else if (overdue.length) {
    bullets.push({ lead: `${overdue.length} of ${total} overdue:`, text: "all are in the blocked list; re-date once unblocked." });
  } else {
    bullets.push({ lead: "0 overdue:", text: "confirm owners are on track for upcoming dates." });
  }

  const nextStart = backlog.find((t) => !named.has(t.id));
  const nextFinish = open.slice().sort(byImpact).find((t) => !named.has(t.id));
  if (nextStart) {
    bullets.push({
      lead: `${pct(backlog.length)} in Backlog:`,
      text: `start ${nextStart.id} (${nextStart.assignee}); pause the lowest-impact work.`,
    });
  } else if (nextFinish) {
    bullets.push({ lead: "Backlog covered:", text: `finish ${nextFinish.id} (${nextFinish.assignee}) next.` });
  } else {
    bullets.push({ lead: "100% done:", text: "hold a short review and log lessons learned." });
  }
  return bullets;
}

function renderOverview() {
  const total = state.tasks.length;
  const counts = STATUSES.map((s) => ({ status: s, n: state.tasks.filter((t) => t.status === s).length }));
  const overdueCount = state.tasks.filter(isOverdue).length;

  let acc = 0;
  const stops = counts
    .filter((c) => c.n > 0)
    .map((c) => {
      const from = (acc / total) * 100;
      acc += c.n;
      const to = (acc / total) * 100;
      return `${PIE_COLORS[c.status]} ${from}% ${to}%`;
    });
  const pieBg = total ? `conic-gradient(${stops.join(", ")})` : "var(--color-border)";

  const legend = counts.map((c) => {
    const pct = total ? Math.round((c.n / total) * 1000) / 10 : 0;
    return `<li><span class="swatch ${PIE_SWATCH[c.status]}"></span>${escapeHtml(c.status)}: <strong>${c.n}</strong> (${pct}%)</li>`;
  }).join("");

  const bullets = total
    ? buildExecutiveSummary().map((b) => `<li><strong>${escapeHtml(b.lead)}</strong> ${escapeHtml(b.text)}</li>`).join("")
    : "<li>No tasks yet. Add the first task to see the summary.</li>";

  document.getElementById("overview").innerHTML = `
    <div>
      <h2>All activities by status</h2>
      <div class="pie-wrap">
        <div class="pie" style="background: ${pieBg}" role="img" aria-label="Pie chart of ${total} tasks by status"></div>
        <ul class="pie-legend">${legend}</ul>
      </div>
      <p class="pie-note">${total} tasks, ${overdueCount} overdue.</p>
    </div>
    <div>
      <h2>Executive summary</h2>
      <ul class="exec-list">${bullets}</ul>
    </div>`;
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(renderColumn).join("");
  attachBoardEventListeners();
  renderSummaryStrip();
  renderCriticalView();
  renderOverview();
}

function renderProjectFilterOptions() {
  const select = document.getElementById("filter-project");

  select.value = current;

/* =========================================================================
   EVENT WIRING for dynamically rendered board content
   ========================================================================= */
function attachBoardEventListeners() {
  const board = document.getElementById("board");

  // Delegate clicks for delete / confirm / cancel buttons
  board.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");

    if (action === "start-delete") {
      el.addEventListener("click", () => {
        state.pendingDeleteId = id;
        renderBoard();
      });
    } else if (action === "confirm-delete") {
      el.addEventListener("click", () => deleteTask(id));
    } else if (action === "cancel-delete") {
      el.addEventListener("click", () => {
        state.pendingDeleteId = null;
        renderBoard();
      });
    } else if (action === "move") {
      el.addEventListener("change", (e) => {
        moveTask(id, e.target.value);
      });
    }
  });

  // Drag and drop: cards
  board.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", card.getAttribute("data-id"));
      e.dataTransfer.effectAllowed = "move";
    });
  });

  // Drag and drop: columns as drop targets
  board.querySelectorAll(".column").forEach((column) => {
    const status = column.getAttribute("data-status");

    column.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      column.classList.add("drag-over");
    });

    column.addEventListener("dragleave", () => {
      column.classList.remove("drag-over");
    });

    column.addEventListener("drop", (e) => {
      e.preventDefault();
      column.classList.remove("drag-over");
      const taskId = e.dataTransfer.getData("text/plain");
      if (taskId) moveTask(taskId, status);
    });
  });
}

/* =========================================================================
   MUTATIONS — moveTask(), deleteTask(), addTask()
   ========================================================================= */
function moveTask(taskId, newStatus) {
  const task = state.tasks.find((t) => t.id === taskId);
  if (!task || !STATUSES.includes(newStatus)) return;
  task.status = newStatus;
  renderBoard();
}

function deleteTask(taskId) {
  state.tasks = state.tasks.filter((t) => t.id !== taskId);
  state.pendingDeleteId = null;
  renderBoard();
}

function addTask(taskData) {
  const task = Object.assign({ id: nextTaskId() }, taskData);
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* =========================================================================
   FILTERS
   ========================================================================= */
function applyFilters() {
  state.filters.project = document.getElementById("filter-project").value;
  state.filters.assignee = document.getElementById("filter-assignee").value.trim();
  state.filters.priority = document.getElementById("filter-priority").value;
  renderBoard();
}

function clearFilters() {
  document.getElementById("filter-project").value = "";
  document.getElementById("filter-assignee").value = "";
  document.getElementById("filter-priority").value = "";
  state.filters = { project: "", assignee: "", priority: "" };
  renderBoard();
}

/* =========================================================================
   TOASTS
   ========================================================================= */
function showToast(message, type) {
  const region = document.getElementById("toast-region");
  const toast = document.createElement("div");
  toast.className = "toast toast-" + (type || "success");
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => {
    toast.remove();
  }, 4500);
}

/* =========================================================================
   FORMSUBMIT NOTIFICATION — fire-and-forget, never blocks the UI
   ========================================================================= */
async function notifyNewTask(task) {
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[ABC IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return await res.json();
  } catch (err) {
    // A FormSubmit failure must never break the board — surface a soft warning only.
    showToast("Card added locally — email notification failed.", "warning");
    return null;
  }
}

/* =========================================================================
   ADD TASK FORM — validation + submit handling
   ========================================================================= */
const modalOverlay = document.getElementById("modal-overlay");
const addTaskForm = document.getElementById("add-task-form");
const submitBtn = document.getElementById("submit-task-btn");

function openModal() {
  modalOverlay.classList.remove("hidden");
  document.getElementById("field-title").focus();
}

function closeModal() {
  modalOverlay.classList.add("hidden");
  addTaskForm.reset();
  clearFormErrors();
  document.getElementById("description-count").textContent = "0 / 500";
}

function clearFormErrors() {
  ["title", "description", "assignee", "due-date"].forEach((key) => {
    document.getElementById("error-" + key).textContent = "";
  });
}

function validateForm(values) {
  const errors = {};

  if (!values.title.trim()) {
    errors.title = "Task title is required.";
  } else if (values.title.length > 80) {
    errors.title = "Task title must be 80 characters or fewer.";
  }

  if (values.description.length > 500) {
    errors.description = "Description must be 500 characters or fewer.";
  }

  if (!values.assignee.trim()) {
    errors.assignee = "Assignee is required.";
  }

  if (!values.dueDate) {
    errors["due-date"] = "Due date is required.";
  } else if (values.dueDate < todayIsoDate()) {
    errors["due-date"] = "Due date cannot be in the past.";
  }

  return errors;
}

document.getElementById("field-description").addEventListener("input", (e) => {
  document.getElementById("description-count").textContent = e.target.value.length + " / 500";
});

addTaskForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearFormErrors();

  const values = {
    title: document.getElementById("field-title").value,
    description: document.getElementById("field-description").value,
    project: document.getElementById("field-project").value,
    category: document.getElementById("field-category").value,
    assignee: document.getElementById("field-assignee").value,
    priority: document.getElementById("field-priority").value,
    dueDate: document.getElementById("field-due-date").value,
    status: document.getElementById("field-status").value,
  };

  const errors = validateForm(values);
  if (Object.keys(errors).length > 0) {
    Object.entries(errors).forEach(([key, msg]) => {
      const el = document.getElementById("error-" + key);
      if (el) el.textContent = msg;
    });
    return;
  }

  // Optimistic UI: add the card immediately, then fire the notification in parallel.
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  const task = addTask({
    title: values.title.trim(),
    description: values.description.trim(),
    project: values.project,
    category: values.category,
    assignee: values.assignee.trim(),
    priority: values.priority,
    dueDate: values.dueDate,
    status: values.status,
  });

  showToast(`Task ${task.id} added.`, "success");
  addTaskForm.reset();
  document.getElementById("description-count").textContent = "0 / 500";

  // Keep the button in its "Sending…" state until the notification settles.
  // notifyNewTask() swallows its own errors, so this always re-enables the form.
  await notifyNewTask(task);

  submitBtn.disabled = false;
  submitBtn.textContent = "Add Task";
  closeModal();
});

/* =========================================================================
   INIT — wire up static controls and render the initial board
   ========================================================================= */
function init() {
  seedTasks();
  renderProjectFilterOptions();
  renderBoard();

  document.getElementById("open-add-task-btn").addEventListener("click", openModal);
  document.getElementById("close-modal-btn").addEventListener("click", closeModal);
  document.getElementById("cancel-add-task-btn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !modalOverlay.classList.contains("hidden")) closeModal();
  });

  document.getElementById("filter-project").addEventListener("change", applyFilters);
  document.getElementById("filter-assignee").addEventListener("input", applyFilters);
  document.getElementById("filter-priority").addEventListener("change", applyFilters);
  document.getElementById("clear-filters-btn").addEventListener("click", clearFilters);

  // Default the due-date field's min to today
  document.getElementById("field-due-date").setAttribute("min", todayIsoDate());
}

init();
</script>
