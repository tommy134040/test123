<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UOB IT PMO — Kanban Board</title>
<style>
  /* ============================= Design tokens ============================= */
  :root {
    --color-bg: #f2f5fa;
    --color-surface: #ffffff;
    --color-border: #d7e0ec;
    --color-header-bg: #0b2f6b;
    --color-header-text: #ffffff;
    --color-primary: #0b2f6b;
    --color-primary-dark: #082352;
    --color-primary-light: #e8eefc;
    --color-accent: #1d5fd6;
    --color-text: #1a2333;
    --color-text-muted: #5b6a82;
    --color-critical: #c0223a;
    --color-high: #c97a10;
    --color-medium: #1d5fd6;
    --color-low: #6b7686;
    --color-danger: #c0223a;
    --color-success: #1a8a4a;
    --color-warning: #c97a10;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --focus-ring: 3px solid #1d5fd6aa;

    /* Categorical chart palette (status pie): the dataviz skill's own
       validated 4-slot order — chroma floor, CVD adjacent-pair separation
       (worst pair deltaE 9.1), and normal-vision floor all pass in this
       exact order. Kept distinct from --color-critical/success/etc., which
       encode priority, not chart category — reusing those here put red
       (Blocked) directly next to green (Done): deltaE 3.1, a real
       red-green colorblind failure caught by the validator. */
    --chart-cat-1: #2a78d6;
    --chart-cat-2: #eb6834;
    --chart-cat-3: #1baf7a;
    --chart-cat-4: #eda100;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-stack);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.4;
  }

  a, button, input, select, textarea {
    font-family: inherit;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }

  /* ============================= Header ============================= */
  header.app-header {
    background: var(--color-header-bg);
    color: var(--color-header-text);
    padding: var(--space-md) var(--space-lg);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--space-md);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .wordmark .wordmark-badge {
    background: #ffffff;
    color: var(--color-primary);
    border-radius: var(--radius-sm);
    padding: 3px 7px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .wordmark .wordmark-divider {
    width: 1px;
    height: 1.1em;
    background: rgba(255, 255, 255, 0.3);
  }

  .btn {
    border: none;
    border-radius: var(--radius-md);
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: #ffffff;
    color: var(--color-primary);
  }
  .btn-primary:hover { background: #e6ecfa; }

  .btn-secondary {
    background: var(--color-accent);
    color: #fff;
  }
  .btn-secondary:hover { background: #164ba8; }

  .btn-ghost {
    background: transparent;
    color: var(--color-text);
    border: 1px solid var(--color-border);
  }
  .btn-ghost:hover { background: var(--color-primary-light); }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Summary strip */
  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    margin-top: var(--space-md);
  }

  .summary-chip {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.85);
    display: flex;
    gap: 7px;
    align-items: baseline;
  }

  .summary-chip strong {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    font-weight: 700;
    color: #ffffff;
  }

  .summary-chip.overdue-chip {
    background: rgba(192,34,58,0.25);
    border-color: rgba(255,180,180,0.5);
  }

  .demo-note {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.8);
    margin-top: var(--space-sm);
  }

  /* ============================= Main layout ============================= */
  main {
    padding: var(--space-lg);
    max-width: 1600px;
    margin: 0 auto;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-md);
    align-items: flex-end;
    margin-bottom: var(--space-lg);
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
  }

  .filter-field label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--color-text-muted);
  }

  input, select, textarea {
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    color: var(--color-text);
    background: #fff;
  }

  .filter-clear {
    align-self: flex-end;
  }

  /* ============================= Overview: status pie ============================= */
  .overview {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    margin-bottom: var(--space-lg);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-lg);
  }

  .overview h2 {
    margin: 0 0 var(--space-sm);
    font-size: 0.95rem;
  }

  .overview-pie-wrap {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
    flex-wrap: wrap;
  }

  .overview-pie {
    flex: none;
    overflow: visible;
  }

  .overview-pie text {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .overview-legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
  }

  .overview-legend li {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .overview-swatch {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    flex: none;
  }

  .overview-legend .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--color-text-muted);
  }

  .overview-note {
    margin: 0;
    font-size: 0.78rem;
    color: var(--color-text-muted);
  }

  .overview-table-toggle {
    font-size: 0.78rem;
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    cursor: pointer;
    color: var(--color-text-muted);
    margin-top: var(--space-xs);
  }
  .overview-table-toggle:hover { background: var(--color-primary-light); }

  .overview-table {
    border-collapse: collapse;
    font-size: 0.82rem;
    margin-top: var(--space-sm);
  }
  .overview-table caption { text-align: left; font-size: 0.78rem; color: var(--color-text-muted); margin-bottom: 4px; }
  .overview-table th,
  .overview-table td {
    text-align: left;
    padding: 4px 10px 4px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .overview-table td.num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  /* ============================= Board ============================= */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
  }

  @media (max-width: 768px) {
    .board { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    min-height: 200px;
    transition: background-color 0.15s ease, box-shadow 0.15s ease;
  }

  .column.drag-over {
    background: var(--color-primary-light);
    box-shadow: inset 0 0 0 2px var(--color-accent);
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border);
  }

  .column-header h2 {
    margin: 0;
    font-size: 1rem;
  }

  .count-badge {
    background: var(--color-primary-light);
    color: var(--color-primary);
    border-radius: 999px;
    padding: 2px 10px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .card-list {
    padding: var(--space-sm);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    flex: 1;
    min-height: 80px;
  }

  .empty-hint {
    color: var(--color-text-muted);
    font-size: 0.8rem;
    text-align: center;
    padding: var(--space-md);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-md);
  }

  /* ============================= Cards ============================= */
  .card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-left-width: 5px;
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    cursor: grab;
    position: relative;
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }

  .card:hover,
  .card:focus-within {
    border-color: var(--color-accent);
    box-shadow: 0 4px 14px rgba(11, 47, 107, 0.12);
    transform: translateY(-1px);
  }

  .card:active { cursor: grabbing; }

  .card.priority-critical { border-left-color: var(--color-critical); }
  .card.priority-high { border-left-color: var(--color-high); }
  .card.priority-medium { border-left-color: var(--color-medium); }
  .card.priority-low { border-left-color: var(--color-low); }

  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-sm);
  }

  .card-id {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--color-text-muted);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 2px 6px;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 4px 0 6px;
    word-break: break-word;
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--color-text-muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1px solid transparent;
  }

  .pill-critical { background: #fbe2e6; color: var(--color-critical); border-color: #f3b7c1; }
  .pill-high { background: #fbead0; color: var(--color-high); border-color: #f0cd8f; }
  .pill-medium { background: #e0eaff; color: var(--color-medium); border-color: #b7cdf5; }
  .pill-low { background: #eceff3; color: var(--color-low); border-color: #d3d9e1; }

  .tag {
    background: transparent;
    color: var(--color-text-muted);
    border: 1px solid var(--color-border);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    font-weight: 600;
  }

  .badge-overdue {
    background: #fbe2e6;
    color: var(--color-critical);
    border: 1px solid #f3b7c1;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    font-weight: 700;
  }

  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    margin-top: 6px;
    border-top: 1px solid var(--color-border);
    padding-top: 6px;
  }

  .move-select {
    font-size: 0.75rem;
    padding: 4px 6px;
    flex: 1;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--color-danger);
    font-size: 0.9rem;
    line-height: 1;
  }
  .icon-btn:hover { background: #fbe2e6; }

  .delete-confirm {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    margin-top: 6px;
    background: #fff6f7;
    border: 1px solid #f3b7c1;
    border-radius: var(--radius-sm);
    padding: 6px 8px;
  }

  .delete-confirm button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
  }

  .confirm-yes { background: var(--color-danger); color: #fff; }
  .confirm-no { background: var(--color-border); color: var(--color-text); }

  /* ============================= Modal ============================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 20, 40, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-xl) var(--space-md);
    overflow-y: auto;
    z-index: 100;
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    max-width: 560px;
    width: 100%;
    padding: var(--space-lg);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-md);
  }

  .modal-header h2 { margin: 0; font-size: 1.1rem; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }

  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field.full-width { grid-column: 1 / -1; }

  .form-field label {
    font-size: 0.8rem;
    font-weight: 600;
  }

  .required-mark { color: var(--color-danger); }

  .field-error {
    color: var(--color-danger);
    font-size: 0.75rem;
    min-height: 1em;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-sm);
    margin-top: var(--space-lg);
  }

  .char-count {
    font-size: 0.7rem;
    color: var(--color-text-muted);
    text-align: right;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ============================= Toasts ============================= */
  #toast-region {
    position: fixed;
    bottom: var(--space-lg);
    right: var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    z-index: 200;
    max-width: 320px;
  }

  .toast {
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 0.85rem;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  .toast-success { background: var(--color-success); }
  .toast-warning { background: var(--color-warning); }
  .toast-error { background: var(--color-danger); }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<!-- ============================= Header: wordmark, summary strip, add-task ============================= -->
<header class="app-header">
  <div class="header-top">
    <div class="wordmark">
      <span class="wordmark-badge">UOB&nbsp;IT</span>
      <span class="wordmark-divider" aria-hidden="true"></span>
      <span>PMO Kanban Board</span>
    </div>
    <button type="button" class="btn btn-primary" id="open-add-task-btn">+ Add Task</button>
  </div>

  <div class="summary-strip" id="summary-strip" aria-live="polite"></div>

  <p class="demo-note">
    Demo mode: this board keeps state in memory only for this browser tab. Refreshing the page resets it to the seeded demo data — no data is saved to a server or your device.
  </p>
</header>

<main>
  <!-- ============================= Filter bar ============================= -->
  <section class="filter-bar" aria-label="Filter tasks">
    <div class="filter-field">
      <label for="filter-project">Project / Workstream</label>
      <select id="filter-project">
        <option value="">All projects</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="text" id="filter-assignee" placeholder="e.g. Priya">
    </div>
    <div class="filter-field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority">
        <option value="">All priorities</option>
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <button type="button" class="btn btn-ghost filter-clear" id="clear-filters-btn">Clear filters</button>
  </section>

  <!-- ============================= Overview: status pie (always totals, not filtered) ============================= -->
  <section class="overview" id="overview" aria-label="All activities by status"></section>

  <!-- ============================= Kanban board ============================= -->
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- ============================= Add Task modal ============================= -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">Add Task</h2>
      <button type="button" class="icon-btn" id="close-modal-btn" aria-label="Close add task form" style="color: var(--color-text);">✕</button>
    </div>

    <form id="add-task-form" novalidate>
      <div class="form-grid">
        <div class="form-field full-width">
          <label for="field-title">Task Title <span class="required-mark">*</span></label>
          <input type="text" id="field-title" maxlength="80" required aria-describedby="error-title">
          <span class="field-error" id="error-title" role="alert"></span>
        </div>

        <div class="form-field full-width">
          <label for="field-description">Description</label>
          <textarea id="field-description" maxlength="500" rows="3" aria-describedby="description-count error-description"></textarea>
          <span class="char-count" id="description-count">0 / 500</span>
          <span class="field-error" id="error-description" role="alert"></span>
        </div>

        <div class="form-field">
          <label for="field-project">Project / Workstream</label>
          <select id="field-project">
            <option>Core Banking Upgrade</option>
            <option>Digital Channels</option>
            <option>Cybersecurity Uplift</option>
            <option>Data &amp; Analytics</option>
            <option>Infrastructure &amp; Cloud</option>
            <option>Vendor Management</option>
          </select>
        </div>

        <div class="form-field">
          <label for="field-category">Category</label>
          <select id="field-category">
            <option>Application Development</option>
            <option>Infrastructure</option>
            <option>Cybersecurity</option>
            <option>Data</option>
            <option>Compliance</option>
            <option>Vendor</option>
          </select>
        </div>

        <div class="form-field">
          <label for="field-assignee">Assignee <span class="required-mark">*</span></label>
          <input type="text" id="field-assignee" required aria-describedby="error-assignee">
          <span class="field-error" id="error-assignee" role="alert"></span>
        </div>

        <div class="form-field">
          <label for="field-priority">Priority</label>
          <select id="field-priority">
            <option>Critical</option>
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>

        <div class="form-field">
          <label for="field-due-date">Due Date <span class="required-mark">*</span></label>
          <input type="date" id="field-due-date" required aria-describedby="error-due-date">
          <span class="field-error" id="error-due-date" role="alert"></span>
        </div>

        <div class="form-field">
          <label for="field-status">Status</label>
          <select id="field-status">
            <option>Backlog</option>
            <option>In Progress</option>
            <option>Blocked</option>
            <option>Done</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancel-add-task-btn">Cancel</button>
        <button type="submit" class="btn btn-secondary" id="submit-task-btn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- ============================= Toast region ============================= -->
<div id="toast-region" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================================
   CONFIG — FormSubmit endpoint
   FormSubmit requires one-time activation: the first submission ever sent to
   a given address triggers a confirmation email from FormSubmit to that
   address. Notifications only start delivering after the link in that email
   is clicked. Until then, submissions may silently not arrive, which is
   why the UI never blocks on this call (see notifyNewTask()).
   Swap the email address below to redirect notifications.
   ========================================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* =========================================================================
   STATE — single source of truth. Everything renders from this object.
   No localStorage / sessionStorage / cookies / IndexedDB are used anywhere:
   a page refresh intentionally resets to the seeded demo data below.
   ========================================================================= */
const state = {
  tasks: [],
  filters: {
    project: "",
    assignee: "",
    priority: "",
  },
  taskIdCounter: 0,
  pendingDeleteId: null, // id of the card currently showing inline delete confirm
};

const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management",
];

/* =========================================================================
   UTILITIES
   ========================================================================= */

// Escape any user-supplied string before inserting into innerHTML.
function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function todayIsoDate() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString().slice(0, 10);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayIsoDate();
}

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function nextTaskId() {
  state.taskIdCounter += 1;
  return "UOB-ITPM-" + String(state.taskIdCounter).padStart(4, "0");
}

function priorityClass(priority) {
  return "priority-" + priority.toLowerCase();
}

/* =========================================================================
   SEED DATA — 8 demo tasks across all four columns
   ========================================================================= */
function seedTasks() {
  const seeds = [
    {
      title: "Migrate FX pricing service to AWS",

    },
    {

    },

/* =========================================================================
   RENDER — renderBoard() rebuilds the whole board from state.
   No direct DOM mutation of card contents happens outside this section.
   ========================================================================= */

function getFilteredTasks() {
  const { project, assignee, priority } = state.filters;
  return state.tasks.filter((t) => {
    if (project && t.project !== project) return false;
    if (priority && t.priority !== priority) return false;
    if (assignee && !t.assignee.toLowerCase().includes(assignee.toLowerCase())) return false;
    return true;
  });
}

function renderSummaryStrip() {
  const strip = document.getElementById("summary-strip");
  const total = state.tasks.length;
  const overdueCount = state.tasks.filter(isOverdue).length;

  const counts = STATUSES.map((status) => {
    const n = state.tasks.filter((t) => t.status === status).length;
    return `<span class="summary-chip"><strong>${n}</strong> ${escapeHtml(status)}</span>`;
  }).join("");

  strip.innerHTML =
    `<span class="summary-chip"><strong>${total}</strong> Total tasks</span>` +
    counts +
    `<span class="summary-chip overdue-chip"><strong>${overdueCount}</strong> Overdue</span>`;
}

function renderCard(task) {
  const overdue = isOverdue(task);
  const isConfirmingDelete = state.pendingDeleteId === task.id;

  const moveOptions = STATUSES.map((s) =>
    `<option value="${escapeHtml(s)}" ${s === task.status ? "selected" : ""}>${escapeHtml(s)}</option>`
  ).join("");

  const deleteBlock = isConfirmingDelete
    ? `<div class="delete-confirm">
         <span>Delete?</span>
         <button type="button" class="confirm-yes" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button>
         <button type="button" class="confirm-no" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button>
       </div>`
    : "";

  return `
    <article class="card ${priorityClass(task.priority)}" draggable="true" data-id="${escapeHtml(task.id)}" tabindex="0" aria-label="Task ${escapeHtml(task.id)}: ${escapeHtml(task.title)}">
      <div class="card-top-row">
        <span class="card-id">${escapeHtml(task.id)}</span>
        <button type="button" class="icon-btn" data-action="start-delete" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}">✕</button>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <div class="card-meta">
        <span>Project: ${escapeHtml(task.project)}</span>
        <span>Assignee: ${escapeHtml(task.assignee)}</span>
        <span>Due: ${escapeHtml(formatDate(task.dueDate))}</span>
      </div>
      <div class="card-badges">
        <span class="pill pill-${task.priority.toLowerCase()}">${escapeHtml(task.priority)} priority</span>
        <span class="tag">${escapeHtml(task.category)}</span>
        ${overdue ? '<span class="badge-overdue">⚠ Overdue</span>' : ""}
      </div>
      <div class="card-actions">
        <label class="visually-hidden" for="move-${escapeHtml(task.id)}">Move task ${escapeHtml(task.id)} to column</label>
        <select class="move-select" id="move-${escapeHtml(task.id)}" data-action="move" data-id="${escapeHtml(task.id)}" aria-label="Move ${escapeHtml(task.id)} to a different column">
          ${moveOptions}
        </select>
      </div>
      ${deleteBlock}
    </article>
  `;
}

function renderColumn(status) {
  const tasks = getFilteredTasks().filter((t) => t.status === status);
  const cardsHtml = tasks.length
    ? tasks.map(renderCard).join("")
    : `<p class="empty-hint">No tasks</p>`;

  return `
    <div class="column" data-status="${escapeHtml(status)}">
      <div class="column-header">
        <h2>${escapeHtml(status)}</h2>
        <span class="count-badge">${tasks.length}</span>
      </div>
      <div class="card-list" data-status="${escapeHtml(status)}">
        ${cardsHtml}
      </div>
    </div>
  `;
}

/* =========================================================================
   OVERVIEW — status pie chart. Colors are --chart-cat-1..4, the dataviz
   skill's own validated categorical order (see the :root comment above the
   tokens) — never the priority tokens (--color-critical etc.), which encode
   a different thing and were shown by the palette validator to put
   Blocked/Done (red/green) in a failing colorblind-adjacent pair.
   Always computed over state.tasks, matching renderSummaryStrip's existing
   unfiltered convention — this is a global total, not scoped by the filter
   bar above it.
   ========================================================================= */
const CHART_CATEGORY_COLOR = {
  "Backlog": "var(--chart-cat-1)",
  "In Progress": "var(--chart-cat-2)",
  "Blocked": "var(--chart-cat-3)",
  "Done": "var(--chart-cat-4)",
};

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function pieSlicePath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

function renderOverview() {
  const total = state.tasks.length;
  const counts = STATUSES.map((status) => ({
    status,
    n: state.tasks.filter((t) => t.status === status).length,
  }));

  const overview = document.getElementById("overview");

  if (total === 0) {
    overview.innerHTML = `<p class="overview-note">No tasks yet. Add the first task to see the status breakdown.</p>`;
    return;
  }

  const nonZero = counts.filter((c) => c.n > 0);
  const cx = 70, cy = 70, r = 60;

  let svgSlices;
  if (nonZero.length === 1) {
    // A full-circle arc is degenerate (0deg == 360deg); draw a plain circle.
    svgSlices = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CHART_CATEGORY_COLOR[nonZero[0].status]}" stroke="var(--color-surface)" stroke-width="2"><title>${escapeHtml(nonZero[0].status)}: ${nonZero[0].n} (100%)</title></circle>`;
  } else {
    let acc = 0;
    svgSlices = counts
      .filter((c) => c.n > 0)
      .map((c) => {
        const startAngle = (acc / total) * 360;
        acc += c.n;
        const endAngle = (acc / total) * 360;
        const pct = Math.round((c.n / total) * 1000) / 10;
        return `<path d="${pieSlicePath(cx, cy, r, startAngle, endAngle)}" fill="${CHART_CATEGORY_COLOR[c.status]}" stroke="var(--color-surface)" stroke-width="2"><title>${escapeHtml(c.status)}: ${c.n} (${pct}%)</title></path>`;
      })
      .join("");
  }

  const legend = counts
    .map((c) => {
      const pct = Math.round((c.n / total) * 1000) / 10;
      return `<li><span class="overview-swatch" style="background: ${CHART_CATEGORY_COLOR[c.status]}"></span>${escapeHtml(c.status)} <span class="count">${c.n} (${pct}%)</span></li>`;
    })
    .join("");

  const tableRows = counts
    .map((c) => {
      const pct = Math.round((c.n / total) * 1000) / 10;
      return `<tr><td>${escapeHtml(c.status)}</td><td class="num">${c.n}</td><td class="num">${pct}%</td></tr>`;
    })
    .join("");

  overview.innerHTML = `
    <div>
      <h2>All activities by status</h2>
      <div class="overview-pie-wrap">
        <svg class="overview-pie" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Pie chart: ${total} tasks by status">
          ${svgSlices}
        </svg>
        <ul class="overview-legend">${legend}</ul>
      </div>
      <button type="button" class="overview-table-toggle" id="overview-table-toggle" aria-expanded="false" aria-controls="overview-table">View as table</button>
      <table class="overview-table" id="overview-table" hidden>
        <caption>Task status breakdown, ${total} total</caption>
        <thead><tr><th scope="col">Status</th><th scope="col">Count</th><th scope="col">Share</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;

  const toggleBtn = document.getElementById("overview-table-toggle");
  const table = document.getElementById("overview-table");
  toggleBtn.addEventListener("click", () => {
    const willShow = table.hidden;
    table.hidden = !willShow;
    toggleBtn.setAttribute("aria-expanded", String(willShow));
    toggleBtn.textContent = willShow ? "Hide table" : "View as table";
  });
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(renderColumn).join("");
  attachBoardEventListeners();
  renderSummaryStrip();
  renderOverview();
}

function renderProjectFilterOptions() {
  const select = document.getElementById("filter-project");
  const current = select.value;
  select.innerHTML =
    '<option value="">All projects</option>' +
    PROJECTS.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
  select.value = current;
}

/* =========================================================================
   EVENT WIRING for dynamically rendered board content
   ========================================================================= */
function attachBoardEventListeners() {
  const board = document.getElementById("board");

  // Delegate clicks for delete / confirm / cancel buttons
  board.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");

    if (action === "start-delete") {
      el.addEventListener("click", () => {
        state.pendingDeleteId = id;
        renderBoard();
      });
    } else if (action === "confirm-delete") {
      el.addEventListener("click", () => deleteTask(id));
    } else if (action === "cancel-delete") {
      el.addEventListener("click", () => {
        state.pendingDeleteId = null;
        renderBoard();
      });
    } else if (action === "move") {
      el.addEventListener("change", (e) => {
        moveTask(id, e.target.value);
      });
    }
  });

  // Drag and drop: cards
  board.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", card.getAttribute("data-id"));
      e.dataTransfer.effectAllowed = "move";
    });
  });

  // Drag and drop: columns as drop targets
  board.querySelectorAll(".column").forEach((column) => {
    const status = column.getAttribute("data-status");

    column.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      column.classList.add("drag-over");
    });

    column.addEventListener("dragleave", () => {
      column.classList.remove("drag-over");
    });

    column.addEventListener("drop", (e) => {
      e.preventDefault();
      column.classList.remove("drag-over");
      const taskId = e.dataTransfer.getData("text/plain");
      if (taskId) moveTask(taskId, status);
    });
  });
}

/* =========================================================================
   MUTATIONS — moveTask(), deleteTask(), addTask()
   ========================================================================= */
function moveTask(taskId, newStatus) {
  const task = state.tasks.find((t) => t.id === taskId);
  if (!task || !STATUSES.includes(newStatus)) return;
  task.status = newStatus;
  renderBoard();
}

function deleteTask(taskId) {
  state.tasks = state.tasks.filter((t) => t.id !== taskId);
  state.pendingDeleteId = null;
  renderBoard();
}

function addTask(taskData) {
  const task = Object.assign({ id: nextTaskId() }, taskData);
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* =========================================================================
   FILTERS
   ========================================================================= */
function applyFilters() {
  state.filters.project = document.getElementById("filter-project").value;
  state.filters.assignee = document.getElementById("filter-assignee").value.trim();
  state.filters.priority = document.getElementById("filter-priority").value;
  renderBoard();
}

function clearFilters() {
  document.getElementById("filter-project").value = "";
  document.getElementById("filter-assignee").value = "";
  document.getElementById("filter-priority").value = "";
  state.filters = { project: "", assignee: "", priority: "" };
  renderBoard();
}

/* =========================================================================
   TOASTS
   ========================================================================= */
function showToast(message, type) {
  const region = document.getElementById("toast-region");
  const toast = document.createElement("div");
  toast.className = "toast toast-" + (type || "success");
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => {
    toast.remove();
  }, 4500);
}

/* =========================================================================
   FORMSUBMIT NOTIFICATION — fire-and-forget, never blocks the UI
   ========================================================================= */
async function notifyNewTask(task) {
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return await res.json();
  } catch (err) {
    // A FormSubmit failure must never break the board — surface a soft warning only.
    showToast("Card added locally — email notification failed.", "warning");
    return null;
  }
}

/* =========================================================================
   ADD TASK FORM — validation + submit handling
   ========================================================================= */
const modalOverlay = document.getElementById("modal-overlay");
const addTaskForm = document.getElementById("add-task-form");
const submitBtn = document.getElementById("submit-task-btn");

let lastFocusedBeforeModal = null;

function getModalFocusable() {
  return Array.from(
    modalOverlay.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')
  ).filter((el) => !el.disabled && el.offsetParent !== null);
}

function setBackgroundInert(isInert) {
  document.querySelector("header.app-header").toggleAttribute("inert", isInert);
  document.querySelector("main").toggleAttribute("inert", isInert);
}

function openModal() {
  lastFocusedBeforeModal = document.activeElement;
  modalOverlay.classList.remove("hidden");
  setBackgroundInert(true);
  document.getElementById("field-title").focus();
}

function closeModal() {
  modalOverlay.classList.add("hidden");
  setBackgroundInert(false);
  addTaskForm.reset();
  clearFormErrors();
  document.getElementById("description-count").textContent = "0 / 500";
  if (lastFocusedBeforeModal) {
    lastFocusedBeforeModal.focus();
    lastFocusedBeforeModal = null;
  }
}

function clearFormErrors() {
  ["title", "description", "assignee", "due-date"].forEach((key) => {
    document.getElementById("error-" + key).textContent = "";
  });
}

function validateForm(values) {
  const errors = {};

  if (!values.title.trim()) {
    errors.title = "Task title is required.";
  } else if (values.title.length > 80) {
    errors.title = "Task title must be 80 characters or fewer.";
  }

  if (values.description.length > 500) {
    errors.description = "Description must be 500 characters or fewer.";
  }

  if (!values.assignee.trim()) {
    errors.assignee = "Assignee is required.";
  }

  if (!values.dueDate) {
    errors["due-date"] = "Due date is required.";
  } else if (values.dueDate < todayIsoDate()) {
    errors["due-date"] = "Due date cannot be in the past.";
  }

  return errors;
}

document.getElementById("field-description").addEventListener("input", (e) => {
  document.getElementById("description-count").textContent = e.target.value.length + " / 500";
});

addTaskForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearFormErrors();

  const values = {
    title: document.getElementById("field-title").value,
    description: document.getElementById("field-description").value,
    project: document.getElementById("field-project").value,
    category: document.getElementById("field-category").value,
    assignee: document.getElementById("field-assignee").value,
    priority: document.getElementById("field-priority").value,
    dueDate: document.getElementById("field-due-date").value,
    status: document.getElementById("field-status").value,
  };

  const errors = validateForm(values);
  if (Object.keys(errors).length > 0) {
    Object.entries(errors).forEach(([key, msg]) => {
      const el = document.getElementById("error-" + key);
      if (el) el.textContent = msg;
    });
    return;
  }

  // Optimistic UI: add the card immediately, then fire the notification in parallel.
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  const task = addTask({
    title: values.title.trim(),
    description: values.description.trim(),
    project: values.project,
    category: values.category,
    assignee: values.assignee.trim(),
    priority: values.priority,
    dueDate: values.dueDate,
    status: values.status,
  });

  showToast(`Task ${task.id} added.`, "success");
  closeModal();

  submitBtn.disabled = false;
  submitBtn.textContent = "Add Task";

  notifyNewTask(task);
});

/* =========================================================================
   INIT — wire up static controls and render the initial board
   ========================================================================= */
function init() {
  seedTasks();
  renderProjectFilterOptions();
  renderBoard();

  document.getElementById("open-add-task-btn").addEventListener("click", openModal);
  document.getElementById("close-modal-btn").addEventListener("click", closeModal);
  document.getElementById("cancel-add-task-btn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (modalOverlay.classList.contains("hidden")) return;
    if (e.key === "Escape") {
      closeModal();
      return;
    }
    if (e.key !== "Tab") return;
    const focusable = getModalFocusable();
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  document.getElementById("filter-project").addEventListener("change", applyFilters);
  document.getElementById("filter-assignee").addEventListener("input", applyFilters);
  document.getElementById("filter-priority").addEventListener("change", applyFilters);
  document.getElementById("clear-filters-btn").addEventListener("click", clearFilters);

  // Default the due-date field's min to today
  document.getElementById("field-due-date").setAttribute("min", todayIsoDate());
}

init();
</script>
